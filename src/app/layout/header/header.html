@let t = i18n.d();
<header class="header">
  <div class="container header__inner">
    <a [routerLink]="'/' | lp: i18n.lang()" class="header__logo" [attr.aria-label]="t.nav.logo">
      <img [src]="site.logo.darkSrc" alt="" [width]="site.logo.width" [height]="site.logo.height" />
    </a>

    <nav class="header__nav" [attr.aria-label]="t.nav.main">
      <ul role="list">
        @for (item of site.nav; track item.path) {
          <li>
            <a [routerLink]="item.path | lp: i18n.lang()" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{ t.nav[item.key] }}</a>
          </li>
        }
      </ul>
    </nav>

    <!-- Sélecteur de langue : bureau uniquement (sur mobile, il est dans le menu) -->
    <app-language-switcher class="header__lang" />

    <a [routerLink]="'/disponibilita' | lp: i18n.lang()" class="btn btn--primary header__cta">{{ t.cta.primary }}</a>

    <button
      type="button"
      class="btn btn--icon header__burger"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      [attr.aria-label]="t.nav.openMenu"
      (click)="openMenu()"
    >
      <app-icon name="menu" />
    </button>
  </div>
</header>

<!-- Menu mobile plein écran -->
<dialog #menu id="mobile-menu" class="mobile-menu" [attr.aria-label]="t.nav.mainMobile" (close)="onMenuClosed()">
  <div class="mobile-menu__top">
    <a [routerLink]="'/' | lp: i18n.lang()" class="header__logo" [attr.aria-label]="t.nav.logo">
      <img [src]="site.logo.src" alt="" [width]="site.logo.width" [height]="site.logo.height" />
    </a>
    <app-language-switcher class="mobile-menu__lang" />
    <button type="button" class="btn btn--icon" [attr.aria-label]="t.nav.closeMenu" (click)="closeMenu()">
      <app-icon name="close" />
    </button>
  </div>

  <nav class="mobile-menu__nav" [attr.aria-label]="t.nav.main">
    <ul role="list">
      @for (item of site.nav; track item.path) {
        <li>
          <a [routerLink]="item.path | lp: i18n.lang()" routerLinkActive="is-active" ariaCurrentWhenActive="page">
            {{ t.nav[item.key] }}
            <app-icon name="arrow-right" />
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="mobile-menu__ctas">
    <a [routerLink]="'/disponibilita' | lp: i18n.lang()" class="btn btn--primary btn--block">{{ t.cta.primary }}</a>
    <a [routerLink]="'/per-professionisti' | lp: i18n.lang()" class="btn btn--outline btn--block">{{ t.cta.pro }}</a>
  </div>
</dialog>
